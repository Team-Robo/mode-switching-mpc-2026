# MPC / move_base local planner: configs/mpc_local_planner_params.yaml (ns MpcLocalPlannerROS)

lidar_filter:
  source_topic: /front/scan
  pub_topic: /front/scan_filtered
  outlier_threshold: 0.1
  bench_log_enabled: true
  bench_log_period_s: 1.0

laser_scan_to_point_cloud:
  # Overridden in move_base_mlda_2026.launch from enable_lidar_filter (filtered vs raw).
  scan_topic: /front/scan_filtered
  bench_log_enabled: false
  bench_log_period_s: 1.0

map_to_cloud:
  debug_enabled: true
  debug_log_period_s: 1.0
  publish_bbox_marker: true
  # output_frame: odom   # optional; default = costmap header.frame_id
  bench_log_enabled: false
  bench_log_period_s: 1.0
